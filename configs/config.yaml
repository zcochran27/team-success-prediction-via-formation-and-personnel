# D1 Soccer Prediction — central configuration.
# All paths are relative to the repo root unless otherwise noted.

data_paths:
  raw: data/raw                       # raw Wyscout event logs (gitignored)
  processed: data/processed           # cleaned, filtered event data
  team_seasons: data/team_seasons     # final team-season observations
  archetype_artifacts: data/processed/archetype_artifacts  # fitted cluster models + player->archetype map

# Intra-event clustering. Each "logical event type" is either a primary
# Wyscout event type (pass, shot, goalkeeper_exit) or a duel split on the
# offensive_duel / defensive_duel secondary tag.
event_clustering:
  # Number of event-instance clusters per (position group, event type).
  # Use `archetypes/notebooks/event_clustering.ipynb` (k-sweep cell) to
  # pick k from elbow / silhouette curves and edit the values below.
  n_clusters_per_event:
    CD:  {pass: 12, offensive_duel: 5, defensive_duel: 6, aerial_duel: 5, shot: 5}
    LWD: {pass: 12, offensive_duel: 5, defensive_duel: 4, aerial_duel: 4, shot: 5}
    RWD: {pass: 12, offensive_duel: 5, defensive_duel: 4, aerial_duel: 4, shot: 5}
    CM:  {pass: 12, offensive_duel: 4, defensive_duel: 6, aerial_duel: 6, shot: 7}
    CF:  {pass: 12, offensive_duel: 6, defensive_duel: 4, aerial_duel: 6, shot: 7}
    LWP: {pass: 12, offensive_duel: 6, defensive_duel: 4, aerial_duel: 6, shot: 7}
    RWP: {pass: 12, offensive_duel: 6, defensive_duel: 4, aerial_duel: 6, shot: 7}
    GK:  {pass: 4, goalkeeper_exit: 3}
  # Which event types are used to characterize each position group.
  # GK uses a different vocabulary from outfield players.
  event_types_per_group:
    CD:  [pass, offensive_duel, defensive_duel, aerial_duel, shot]
    LWD: [pass, offensive_duel, defensive_duel, aerial_duel, shot]
    RWD: [pass, offensive_duel, defensive_duel, aerial_duel, shot]
    CM:  [pass, offensive_duel, defensive_duel, aerial_duel, shot]
    CF:  [pass, offensive_duel, defensive_duel, aerial_duel, shot]
    LWP: [pass, offensive_duel, defensive_duel, aerial_duel, shot]
    RWP: [pass, offensive_duel, defensive_duel, aerial_duel, shot]
    GK:  [pass, goalkeeper_exit]
  # Minimum events a player must have logged across the relevant types
  # to be included in the archetype clustering for their group.
  min_events_per_player: 100
  random_state: 0

# Archetype clustering: number of archetypes per position group.
archetype_clustering:
  n_archetypes_per_group:
    CD:  3          # Center Defenders
    LWD: 3          # Left full-backs / wing-backs
    RWD: 3          # Right full-backs / wing-backs
    CM:  4          # Center Midfielders
    CF:  3          # Center Forwards
    LWP: 3          # Left wingers + wide attacking mids + wide forwards
    RWP: 3          # Right wingers + wide attacking mids + wide forwards
    GK:  2          # Goalkeepers
  random_state: 0

# Formation-snapshot pipeline.
formations:
  # Sub-cluster collapse window (minutes). Consecutive sub-induced snapshots
  # whose first sub falls within this many minutes of the cluster's first sub
  # are merged into one segment whose personnel reflects the post-last-sub
  # lineup. Formation changes are always hard barriers regardless of T.
  sub_cluster_window_min: 10

# Cross-validation harness.
evaluation:
  k_folds: 5
  random_seed: 42
  targets:
    - win_rate
    - points_per_game

# GNN architecture / training hyperparameters (Models 3 and 4).
model:
  gnn_layers: 2             # 2-3 layers recommended
  layer_type: gcn           # gcn | gat
  hidden_dim: 64
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 0.0
  epochs: 100
  batch_size: 32

# Gradient boosting hyperparameters (Models 1 and 2).
baseline:
  estimator: xgboost        # xgboost | lightgbm
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
